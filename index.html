<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>SHARINGAKTIVITAS TIVI</title>
<meta name="google-site-verification" content="GD_tWdwLW5wknCgGQ5XJncvC8MADhm2G-a9r2hbsAhY" />  
<style>
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f0f0f; color: #fff; margin: 0; padding: 20px; }
  h2 { text-align: center; color: #ffc107; font-size: 28px; margin-bottom: 5px; }
  h2 span { color: #ff0000; }
  .sub { text-align: center; color: #aaa; margin-bottom: 30px; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; max-width: 1300px; margin: 20px auto; }
  .card { background: #1a1a1a; border-radius: 12px; overflow: hidden; cursor: pointer; transition: 0.2s; border: 1px solid #333; }
  .card:hover { transform: translateY(-5px); border-color: #ffc107; box-shadow: 0 5px 15px #ffc10733; }
  .thumb { width: 100%; aspect-ratio: 16/9; background: #000; position: relative; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .play-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 60px; color: #ff0000; text-shadow: 0 0 10px #000; opacity: 0.9; transition: 0.2s; }
  .card:hover .play-btn { opacity: 1; transform: translate(-50%,-50%) scale(1.1); }
  .info { padding: 14px; }
  .title { font-size: 15px; font-weight: bold; height: 40px; overflow: hidden; line-height: 1.3; }
  .date { font-size: 12px; color: #aaa; margin-top: 6px; }
  .loader { text-align: center; padding: 80px 20px; font-size: 18px; color: #ffc107; }
  iframe { width: 100%; height: 100%; border: none; }
</style>
</head>
<body>

<h2><span>SHARINGAKTIVITAS</span> MANTAP TV</h2>
<p class="sub">Video Terbaru Langsung dari YouTube</p>
<div id="status" class="loader">⏳ Memuat video terbaru...</div>
<div class="grid" id="videoGrid"></div>

<script>
const CHANNEL_ID = "UCsWGjFilQTLEVE7gW1CvbEA";

async function loadVideos() {
  const grid = document.getElementById('videoGrid');
  const status = document.getElementById('status');
  
  grid.innerHTML = '';
  status.innerText = '⏳ Memuat video terbaru...';
  status.style.display = 'block';

  try {
    // Memakai RSS resmi YouTube dikonversi ke JSON via rss2json (Cepat & ada Auto-Cache)
    const rssUrl = `https://youtube.com{CHANNEL_ID}`;
    const apiUrl = `https://rss2json.com{encodeURIComponent(rssUrl)}`;

    const res = await fetch(apiUrl);
    if (!res.ok) throw new Error("Gagal mengambil data dari server");
    
    const data = await res.json();
    
    if (data.status !== 'ok' || !data.items || data.items.length === 0) {
      throw new Error("Video tidak ditemukan atau API sedang limit");
    }

    const videos = [];
    data.items.forEach(item => {
      // Ekstrak ID Video dengan aman dari link YouTube bawaan RSS
      let videoId = "";
      if (item.link.includes("v=")) {
        videoId = item.link.split("v=")[1].split("&")[0];
      } else if (item.link.includes("shorts/")) {
        videoId = item.link.split("shorts/")[1].split("?")[0];
      }

      if (videoId) {
        videos.push({
          title: item.title,
          id: videoId,
          pubDate: item.pubDate
        });
      }
    });

    status.style.display = 'none';
    renderVideos(videos);

  } catch(e) {
    status.innerText = '❌ Gagal load video. Silakan refresh halaman. Error: ' + e.message;
    console.error(e);
  }
}

function renderVideos(videos) {
  const grid = document.getElementById('videoGrid');
  grid.innerHTML = "";
  
  videos.forEach(video => {
    const thumbUrl = `https://ytimg.com{video.id}/mqdefault.jpg`; 
    const date = new Date(video.pubDate).toLocaleDateString('id-ID', {day: '2-digit', month: 'short', year: 'numeric'});

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="thumb" onclick="playVideo(this, '${video.id}')">
        <img src="${thumbUrl}" loading="lazy"> 
        <div class="play-btn">▶️</div>
      </div>
      <div class="info">
        <div class="title">${video.title}</div>
        <div class="date">Upload: ${date}</div>
      </div>
    `;
    grid.appendChild(card);
  });
}

function playVideo(element, videoId) {
  element.innerHTML = `<iframe src="https://youtube.com{videoId}?autoplay=1&rel=0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
}

// Jalankan fungsi secara otomatis saat halaman dibuka
loadVideos();
</script>
</body>
</html>
